name: Crea APK Canzoni Coro V20

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Estrai progetto V20
        run: |
          rm -rf progetto
          mkdir progetto
          unzip -q CanzoniCoro_V20_GitHub.zip -d progetto
          test -f progetto/android/settings.gradle
          test -f progetto/android/app/build.gradle

      - name: Compila APK V20
        working-directory: progetto/android
        run: gradle :app:assembleDebug --no-daemon

      - name: Pubblica APK V20
        uses: actions/upload-artifact@v4
        with:
          name: Canzoni-Coro-V20-APK
          path: progetto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
